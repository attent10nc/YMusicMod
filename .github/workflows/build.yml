name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        shell: pwsh
        run: ./scripts/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: YMusicMod-Setup
          path: dist/YMusicMod-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YMusicMod-Setup.exe
          generate_release_notes: true
