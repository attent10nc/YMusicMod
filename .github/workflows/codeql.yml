name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # C# is compiled with plain csc (no .csproj), so build-mode none gives low-quality extraction; trace the real build
          - language: csharp
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: matrix.build-mode == 'manual'
        shell: pwsh
        run: |
          npm ci
          ./scripts/build.ps1

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
