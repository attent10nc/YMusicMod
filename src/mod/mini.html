<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Яндекс Музыка · мини</title>
<style>
  :root { --a: #f2f2f2; --on-a: #000; --ease: cubic-bezier(.16, 1, .3, 1); --spring: linear(0, .009, .035 2.1%, .141 4.4%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font-family: "YS Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #f4f4f6; user-select: none; }
  .island { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; background: #111; -webkit-app-region: drag; display: flex; flex-direction: column; padding: 14px 16px 12px; gap: 10px; animation: enter .6s var(--ease) both; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  .bg { position: absolute; inset: -40px; background: center/cover; filter: blur(34px) saturate(1.5) brightness(.42); transition: opacity .8s ease; }
  .bg.b { opacity: 0; }
  .tint { position: absolute; inset: 0; background: linear-gradient(110deg, rgba(14,14,18,.5), rgba(14,14,18,.15) 60%, color-mix(in srgb, var(--a) 22%, transparent)); transition: background .8s; }
  canvas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 56px; pointer-events: none; opacity: .75; }
  .island > :not(.bg):not(.tint):not(canvas) { position: relative; }
  .top { display: flex; align-items: center; gap: 14px; min-height: 0; }
  .cover { position: relative; width: 70px; height: 70px; flex-shrink: 0; border-radius: 16px; background: #26262c; cursor: pointer; -webkit-app-region: no-drag; transition: transform .4s var(--spring); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .cover i { position: absolute; inset: 0; background: center/cover; transition: opacity .6s ease, transform .7s var(--ease); }
  .cover i.b { opacity: 0; transform: scale(1.12); }
  .cover:hover { transform: scale(1.06); }
  .cover:active { transform: scale(.96); }
  .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .line { overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent); }
  .line span { display: inline-block; }
  /* Длинное название плавно уезжает и возвращается, чтобы его можно было прочитать целиком. */
  .line.long span { animation: marquee var(--t, 12s) ease-in-out 1.6s infinite alternate; }
  @keyframes marquee { 0%, 12% { transform: none; } 88%, 100% { transform: translateX(var(--shift)); } }
  .title { font-size: 16px; font-weight: 700; }
  .artist { font-size: 13px; opacity: .62; }
  .swap .meta { animation: metaIn .5s var(--ease) both; }
  @keyframes metaIn { from { opacity: 0; transform: translateY(8px); } }
  .ctrl { display: flex; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
  button { -webkit-app-region: no-drag; border: 0; background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center; border-radius: 50%; transition: background .15s, transform .32s var(--spring), color .15s, opacity .15s, filter .15s; }
  button:hover { transform: scale(1.08); }
  button:active { transform: scale(.88); transition-duration: .08s; }
  .ib { width: 38px; height: 38px; opacity: .85; }
  .ib:hover { background: rgba(255,255,255,.1); opacity: 1; }
  .play { width: 50px; height: 50px; background: var(--a); color: var(--on-a); margin: 0 2px; box-shadow: 0 6px 20px color-mix(in srgb, var(--a) 40%, transparent); }
  .play:hover { filter: brightness(1.1); }
  svg { width: 19px; height: 19px; fill: currentColor; }
  .play svg { width: 22px; height: 22px; }
  .prog { display: flex; align-items: center; gap: 10px; font-size: 11px; font-variant-numeric: tabular-nums; -webkit-app-region: no-drag; }
  .prog > span { opacity: .6; min-width: 34px; }
  .prog > span:last-child { text-align: right; }
  .bar { position: relative; flex: 1; height: 18px; display: flex; align-items: center; cursor: pointer; }
  .bar::before { content: ""; position: absolute; left: 0; right: 0; height: 5px; border-radius: 99px; background: rgba(255,255,255,.16); transition: height .2s var(--ease); }
  .fill { position: absolute; left: 0; height: 5px; border-radius: 99px; background: linear-gradient(90deg, var(--a), color-mix(in oklab, var(--a) 55%, #fff)); box-shadow: 0 0 10px color-mix(in srgb, var(--a) 55%, transparent); transition: height .2s var(--ease); }
  .bar:hover::before, .bar:hover .fill { height: 7px; }
  .knob { position: absolute; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .3s var(--spring); }
  .bar:hover .knob { transform: none; }
  .tip { position: absolute; bottom: 20px; transform: translateX(-50%); padding: 2px 7px; border-radius: 7px; background: rgba(0,0,0,.75); font-size: 11px; opacity: 0; pointer-events: none; transition: opacity .12s; white-space: nowrap; }
  .bar:hover .tip { opacity: 1; }
  .tools { display: flex; gap: 2px; margin-left: 4px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,.1); }
  .tb { width: 26px; height: 26px; border-radius: 8px; background: transparent; opacity: .55; }
  .tb svg { width: 13px; height: 13px; }
  .tb:hover { background: rgba(255,255,255,.12); opacity: 1; }
  .tb.on { color: var(--a); opacity: 1; }
  #like.on svg { animation: heart .46s var(--spring) both; }
  @keyframes heart { from { transform: scale(.5); } }
  body.ghost .tools, body.ghost .ctrl, body.ghost .prog { pointer-events: none; }
  .empty .title { opacity: .6; }
</style>
</head>
<body class="empty">
<div class="island" id="island">
  <div class="bg" id="bgA"></div><div class="bg b" id="bgB"></div><div class="tint"></div>
  <canvas id="vis"></canvas>
  <div class="top">
    <div class="cover" id="cover" title="Развернуть Яндекс Музыку"><i id="cA"></i><i class="b" id="cB"></i></div>
    <div class="meta" id="meta">
      <div class="title line" id="titleL"><span id="title">Ничего не играет</span></div>
      <div class="artist line" id="artistL"><span id="artist">Яндекс Музыка</span></div>
    </div>
    <div class="ctrl">
      <button class="ib" id="prev" title="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="play" id="play" title="Играть / пауза"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ib" id="next" title="Следующий"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </div>
  <div class="prog">
    <span id="cur">0:00</span>
    <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div><div class="tip" id="tip">0:00</div></div>
    <span id="dur">0:00</span>
    <div class="tools">
      <button class="tb" id="like" title="Нравится"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
      <button class="tb" id="ghost" title="Призрак: прозрачный и не мешает кликам (Ctrl+Alt+G)"><svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8v12l3-2 2.5 2 2.5-2 2.5 2 2.5-2 3 2V10a8 8 0 0 0-8-8zm-3 7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm6 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg></button>
      <button class="tb" id="hide" title="Спрятать (вернуть: Ctrl+Alt+M)"><svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
      <button class="tb" id="restore" title="Развернуть Яндекс Музыку"><svg viewBox="0 0 24 24"><path d="M4 4h7v2H7.4l4.3 4.3-1.4 1.4L6 7.4V11H4zm16 16h-7v-2h3.6l-4.3-4.3 1.4-1.4 4.3 4.3V13h2z"/></svg></button>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const PLAY = '<path d="M8 5v14l11-7z"/>';
  const PAUSE = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  let st = { position: 0, duration: 0, playing: false, rate: 1 }, stamp = performance.now(), cover = "", dragging = null, key = "";
  const posNow = () => (st.playing ? Math.min(st.duration || 0, st.position + ((performance.now() - stamp) / 1000) * (st.rate || 1)) : st.position);

  // Полосы спектра вдоль нижнего края. Приходят 15 раз в секунду, между приходами плавно догоняем.
  const cv = $("vis");
  const ctx = cv.getContext("2d");
  let bands = new Array(28).fill(0), shown = new Array(28).fill(0), lastFrame = performance.now();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  function drawBands(now) {
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;
    const W = cv.width, H = cv.height, n = shown.length;
    ctx.clearRect(0, 0, W, H);
    let any = false;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const target = st.playing ? bands[i] : 0;
      shown[i] += (target - shown[i]) * (1 - Math.exp(-dt / (target > shown[i] ? 0.05 : 0.2)));
      if (shown[i] > 0.004) any = true;
      pts.push([(i / (n - 1)) * W, H - shown[i] * H * 0.9]);
    }
    if (any) {
      const col = getComputedStyle(document.documentElement).getPropertyValue("--a").trim() || "#fff";
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, col + "66");
      g.addColorStop(1, col + "00");
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < n; i++) ctx.quadraticCurveTo(pts[i - 1][0], pts[i - 1][1], (pts[i - 1][0] + pts[i][0]) / 2, (pts[i - 1][1] + pts[i][1]) / 2);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  function render(now) {
    const pos = dragging != null ? dragging * (st.duration || 0) : posNow();
    const p = st.duration ? (pos / st.duration) * 100 : 0;
    $("fill").style.width = `${p}%`;
    $("knob").style.left = `${p}%`;
    const r = st.rate || 1;
    $("cur").textContent = fmt(pos / r);
    $("dur").textContent = fmt((st.duration || 0) / r);
    drawBands(now);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  const marquee = (lineEl, textEl) => {
    const over = textEl.scrollWidth - lineEl.clientWidth;
    lineEl.classList.toggle("long", over > 4);
    if (over > 4) {
      textEl.style.setProperty("--shift", `${-over - 16}px`);
      textEl.style.setProperty("--t", `${Math.max(6, over / 14)}s`);
    }
  };
  // Смена обложки и размытого фона: два слоя, новый проявляется поверх старого.
  let coverLayer = 0;
  const setCover = (url) => {
    const css = url ? `url("${url.replace(/"/g, "")}")` : "none";
    const front = coverLayer ? $("cA") : $("cB");
    const back = coverLayer ? $("cB") : $("cA");
    const bgF = coverLayer ? $("bgA") : $("bgB");
    const bgK = coverLayer ? $("bgB") : $("bgA");
    front.style.backgroundImage = css;
    bgF.style.backgroundImage = css;
    front.classList.remove("b");
    back.classList.add("b");
    bgF.classList.remove("b");
    bgK.classList.add("b");
    coverLayer = 1 - coverLayer;
  };
  window.ymmMini.onState((s) => {
    if (s.partial) {
      if ("ghost" in s) { document.body.classList.toggle("ghost", s.ghost); $("ghost").classList.toggle("on", s.ghost); }
      if (s.bands) bands = s.bands;
      return;
    }
    st = s; stamp = performance.now();
    document.body.classList.toggle("empty", !s.title);
    document.body.classList.toggle("playing", !!s.playing);
    const k = `${s.title}|${s.artist}`;
    if (k !== key) {
      key = k;
      $("title").textContent = s.title || "Ничего не играет";
      $("artist").textContent = s.artist || "Яндекс Музыка";
      const isl = $("island");
      isl.classList.remove("swap");
      void isl.offsetWidth;
      isl.classList.add("swap");
      requestAnimationFrame(() => { marquee($("titleL"), $("title")); marquee($("artistL"), $("artist")); });
    }
    $("playIcon").innerHTML = s.playing ? PAUSE : PLAY;
    $("like").classList.toggle("on", !!s.liked);
    if (s.accent) document.documentElement.style.setProperty("--a", s.accent);
    if (s.onAccent) document.documentElement.style.setProperty("--on-a", s.onAccent);
    if (s.cover !== cover) {
      cover = s.cover || "";
      setCover(cover);
    }
  });
  const cmd = (c, v) => window.ymmMini.cmd(c, v);
  $("play").onclick = () => { st.position = posNow(); stamp = performance.now(); st.playing = !st.playing; $("playIcon").innerHTML = st.playing ? PAUSE : PLAY; cmd("toggle"); };
  $("next").onclick = () => cmd("next");
  $("prev").onclick = () => cmd("prev");
  $("like").onclick = () => cmd("like");
  $("ghost").onclick = () => cmd("ghost");
  $("hide").onclick = () => cmd("hide");
  $("restore").onclick = () => cmd("restore");
  $("cover").onclick = () => cmd("restore");
  // Колесо над мини-плеером меняет громкость.
  document.addEventListener("wheel", (e) => cmd(e.deltaY < 0 ? "volup" : "voldown"), { passive: true });
  const bar = $("bar");
  const frac = (e) => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  // pointer capture: отпускание кнопки засчитается, даже если мышь ушла за окно
  bar.addEventListener("pointermove", (e) => {
    const f = frac(e);
    $("tip").style.left = `${f * 100}%`;
    $("tip").textContent = fmt((f * (st.duration || 0)) / (st.rate || 1));
    if (dragging != null) dragging = f;
  });
  bar.addEventListener("pointerdown", (e) => {
    bar.setPointerCapture(e.pointerId);
    dragging = frac(e);
  });
  const finish = (commit) => {
    if (dragging == null) return;
    const f = dragging; dragging = null;
    if (!commit) return;
    st.position = f * (st.duration || 0); stamp = performance.now();
    cmd("seek", f);
  };
  bar.addEventListener("pointerup", () => finish(true));
  bar.addEventListener("pointercancel", () => finish(false));
  bar.addEventListener("lostpointercapture", () => finish(true));
</script>
</body>
</html>
